<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>i-ONE Bank — 올데이 에이전트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 홈 -->
  <div id="home" class="page">
    <div class="hm-scroll" id="hm-scroll">
      <header class="hm-top" id="hm-top">
        <button class="hm-todo press" data-toast="할 일">할 일
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B7485" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4h8"/><polyline points="8 11 12 15 21 5"/></svg>
        </button>
        <div class="hm-icons">
          <button class="hm-ib" data-toast="알림" aria-label="알림"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A1D24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="dot"></span></button>
          <button class="hm-ib" id="hm-cs" aria-label="상담"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1A1D24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13v-2a7 7 0 0 1 14 0v2"/><rect x="3" y="11" width="3.2" height="5" rx="1.4"/><rect x="17.8" y="11" width="3.2" height="5" rx="1.4"/><path d="M19 16c0 2.5-2.5 4.5-6 4.5"/><circle cx="12" cy="20.5" r="1" fill="#1A1D24"/><path d="M9.5 10.5v.5M14.5 10.5v.5"/><path d="M10 14q2 1.5 4 0"/></svg></button>
          <button class="hm-ib" data-toast="전체 메뉴" aria-label="전체 메뉴"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1A1D24" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
      </header>
      <button class="hm-banner" data-toast="IBK Daily Briefing">
        <img src="assets/home-banner.jpg" alt="">
        <div class="hm-bt">일일 금융시황을 한눈에,<br>IBK Daily Briefing</div>
      </button>
      <div class="hm-acc">
        <div class="hm-tabs">
          <button class="hm-tab on" data-t="0"><img src="assets/logo-ibk-tab.png" alt="">기업은행</button>
          <button class="hm-tab" data-t="1">다른금융</button>
          <button class="hm-easy press" data-toast="쉬운뱅킹"><small>가</small>가 쉬운뱅킹</button>
        </div>
        <div class="hm-card" id="hm-card">
          <div class="hm-pane" data-p="0">
            <button class="hm-act" data-toast="메인계좌 설정"><svg width="26" height="26" viewBox="0 0 26 26"><rect width="26" height="26" rx="6" fill="#9097A6"/><path d="M8 10h10l-3-3M18 16H8l3 3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>메인계좌 설정</button>
            <div class="hm-div"></div>
            <button class="hm-act" data-toast="계좌 개설"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M8 3h5l-3 6H6z" fill="#9097A6"/><path d="M13 3l3 1 3 5h-6z" fill="#B3B8C3"/><rect y="8" width="26" height="18" rx="6" fill="#9097A6"/><path d="M13 13v8M9 17h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>계좌 개설하기</button>
          </div>
          <div class="hm-pane off" data-p="1">
            <div class="hm-other"><b>다른 금융사 계좌도<br>여기서 한 번에 볼 수 있어요</b><span>은행·증권·카드를 연결해보세요</span><button data-toast="다른금융 연결">연결하기</button></div>
          </div>
        </div>
      </div>
      <div class="entry">
        <form class="entry-bar" id="entry" autocomplete="off">
          <div class="entry-av" id="entry-av" data-logo></div>
          <div class="entry-field" id="entry-field">
            <input id="entry-inp" type="text" enterkeyhint="send" aria-label="올데이 에이전트에게 물어보기">
            <div class="entry-ph"><span id="entry-ph">올데이 에이전트에게 물어보세요</span></div>
          </div>
          <button class="entry-send" type="submit" aria-label="보내기">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </form>
      </div>
      <div class="hm-dots"><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div>
      <div class="hm-recent" id="hm-recent">
        <button class="hm-rh">최근 이체내역<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="hm-rb"><div>
          <div class="hm-tr"><div class="av">김</div><div class="nm"><b>김하나</b><small>기업 · 9월 27일</small></div><button class="again" data-toast="다시 보내기">보내기</button></div>
          <div class="hm-tr"><div class="av">관</div><div class="nm"><b>관리비</b><small>국민 · 9월 25일</small></div><button class="again" data-toast="다시 보내기">보내기</button></div>
        </div></div>
      </div>
      <div class="hm-sec">나만의 맞춤메뉴</div>
      <div class="hm-menu">
        <button class="hm-mi" data-toast="전체계좌 조회"><i><img src="assets/menu-accounts.png" alt=""></i>전체계좌<br>조회</button>
        <button class="hm-mi" data-toast="이벤트"><i><img src="assets/menu-event.png" alt=""></i>이벤트</button>
        <button class="hm-mi" data-toast="i-ONE가드"><i><img src="assets/menu-guard.png" alt=""></i>i-ONE가드</button>
        <button class="hm-mi" data-toast="MY연금"><i><img src="assets/menu-pension.png" alt=""></i>MY연금</button>
      </div>
    </div>
    <nav class="hm-nav">
      <button class="hm-nb" data-toast="자산"><svg viewBox="0 0 24 24" fill="none" stroke="#9EA3AF" stroke-width="1.9" stroke-linejoin="round"><path d="M11 5a8 8 0 1 0 8 8h-8z"/><path d="M14 2.5a7.5 7.5 0 0 1 7.5 7.5H14z"/></svg>자산</button>
      <button class="hm-nb" data-toast="상품"><svg viewBox="0 0 24 24" fill="none" stroke="#9EA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4h13l1 15.5a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/><path d="M9 4v2.5a3 3 0 0 0 6 0V4"/></svg>상품</button>
      <button class="hm-nb c" data-toast="톡톡송금"><img src="assets/nav-talktalk.png" alt="">톡톡송금</button>
      <button class="hm-nb" data-toast="혜택"><svg viewBox="0 0 24 24" fill="none" stroke="#9EA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8C10.5 4 7 4.5 7.5 6.5 8 8 12 8 12 8zM12 8c1.5-4 5-3.5 4.5-1.5C16 8 12 8 12 8z"/></svg>혜택</button>
      <button class="hm-nb" data-toast="주식"><svg viewBox="0 0 24 24" fill="none" stroke="#9EA3AF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10.5l4.5-4 4.5 4 7-6.5V19a1 1 0 0 1-1 1z"/></svg>주식</button>
    </nav>
  </div>

  <!-- 채팅 -->
  <div id="chat" class="page">
    <div class="nav">
      <div class="nav-row">
        <button class="back" id="btn-back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="#191F28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="nav-av" data-logo></div>
        <div>
          <div class="nav-name">올데이 에이전트</div>
          <div class="nav-sub">IBK기업은행</div>
        </div>
      </div>
      <div class="chip-bar" id="qr"></div>
    </div>
    <div id="msgs"><div class="date-divider">오늘</div></div>
    <div class="input-wrap">
      <div class="input-row">
        <input id="inp" type="text" placeholder="무엇이든 물어보세요" autocomplete="off">
        <button id="snd-btn" aria-label="보내기">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 바텀시트 -->
  <div class="sheet-wrap" id="sheet">
    <div class="sheet-dim" id="sheet-dim"></div>
    <div class="sheet" id="sheet-panel">
      <div class="sheet-grab" id="sheet-grab"><div class="sheet-handle"></div></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <!-- 앱 실행 인트로 (탭하면 건너뛰어요) -->
  <div id="intro" aria-hidden="true">
    <div class="it-scr it-splash">
      <div class="it-logo"><img src="assets/intro-logo.png" alt=""><div class="it-shine"></div></div>
      <img class="it-ibk" src="assets/intro-ibk.png" alt="">
    </div>
    <div class="it-scr it-main">
      <div class="it-sk">
        <div class="sk-top"><div><div class="sk" style="width:130px;height:20px"></div><div class="sk" style="width:180px;height:19px;margin-top:5px"></div></div><div class="sk" style="width:52px;height:52px;border-radius:6px"></div></div>
        <div class="sk sk-card"></div>
        <div class="sk sk-bar"></div>
        <div class="sk" style="width:30%;height:22px;margin-top:30px"></div>
        <div class="sk-row"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
      </div>
      <div class="it-dot"><i></i><i></i><i></i><i></i></div>
      <img class="it-tab" src="assets/intro-tabbar.png" alt="">
    </div>
    <div class="it-scr it-face">
      <h2>Face ID를 이용해<br>로그인할게요</h2>
      <svg class="it-fglyph" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#111" stroke-width="4"><path d="M4 18V11a7 7 0 0 1 7-7h7"/><path d="M46 4h7a7 7 0 0 1 7 7v7"/><path d="M60 46v7a7 7 0 0 1-7 7h-7"/><path d="M18 60h-7a7 7 0 0 1-7-7v-7"/></g>
        <g stroke="#1B64DA" stroke-width="4"><path d="M22 22v5"/><path d="M42 22v5"/><path d="M32 22v13h-3"/><path d="M22 43q10 8 20 0"/></g>
      </svg>
      <div class="it-hud">
        <div class="h-ic h-face"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V11a7 7 0 0 1 7-7h7"/><path d="M46 4h7a7 7 0 0 1 7 7v7"/><path d="M60 46v7a7 7 0 0 1-7 7h-7"/><path d="M18 60h-7a7 7 0 0 1-7-7v-7"/><path d="M22 22v5"/><path d="M42 22v5"/><path d="M32 22v13h-3"/><path d="M22 43q10 8 20 0"/></svg></div>
        <div class="h-ic h-spin"><svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="itg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FE3FF"/><stop offset=".5" stop-color="#3A7BFF"/><stop offset="1" stop-color="#1B2C9A"/></linearGradient></defs><circle cx="32" cy="32" r="26" stroke="url(#itg)" stroke-width="6"/></svg></div>
        <div class="h-ic h-ok"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="27"/><polyline points="21 33 29 41 44 24"/></svg></div>
        <div class="h-lbl">Face ID</div>
      </div>
      <div class="it-other">다른 방법으로 로그인</div>
    </div>
  </div>
  <!-- Face ID -->
  <div id="faceid">
    <div class="fid-box">
      <div class="fid-icon">
        <svg id="fid-face" viewBox="0 0 72 72" fill="none" stroke="#3c3c43" stroke-width="3.5" stroke-linecap="round" style="transition:opacity .25s">
          <path d="M20 4H8Q4 4 4 8V20"/><path d="M52 4H64Q68 4 68 8V20"/><path d="M68 52V64Q68 68 64 68H52"/><path d="M4 52V64Q4 68 8 68H20"/>
          <line x1="25" y1="28" x2="25" y2="35"/><line x1="47" y1="28" x2="47" y2="35"/>
          <path d="M36 33V45L31 50" stroke-width="3"/><path d="M24 57Q36 64 48 57"/>
        </svg>
        <svg id="fid-ok" viewBox="0 0 72 72" fill="none" style="opacity:0;transform:scale(.4);transition:opacity .2s,transform .4s cubic-bezier(.34,1.56,.64,1)">
          <circle cx="36" cy="36" r="30" fill="#0A64C8"/>
          <polyline id="fid-chk" points="22,37 32,47 51,27" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50"/>
        </svg>
      </div>
      <div class="fid-t">Face ID</div>
      <div class="fid-s" id="fid-s">얼굴을 확인하고 있어요</div>
    </div>
  </div>

  <!-- 완료 화면 -->
  <div id="done">
    <div class="dn-main">
      <svg class="dn-check" id="dn-check" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="36"/>
        <polyline points="22,37 32,47 51,27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="dn-title" id="dn-title"></div>
      <div class="dn-sub" id="dn-sub"></div>
      <div class="dn-list" id="dn-list"></div>
    </div>
    <button class="btn btn-primary" id="dn-btn">확인</button>
  </div>

  <div id="toast"></div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
